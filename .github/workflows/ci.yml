name: ci

on: push

jobs:
    ci:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest]
                bun: ["1.4.3"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun }}

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run typecheck
